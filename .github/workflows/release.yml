name: Publish crate
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'cybird-robotics/cybflight-msgs' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: rustup toolchain install 1.94.0 --profile minimal --target thumbv7em-none-eabihf
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'release tag must match Cargo.toml'
          PYCODE
      - name: Verify package
        run: |
          cargo test -p cybflight-msgs
          cargo check -p cybflight-msgs --target thumbv7em-none-eabihf --all-features
          cargo publish -p cybflight-msgs --dry-run --locked
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p cybflight-msgs --locked
