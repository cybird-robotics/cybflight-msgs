[package]
name = "cybflight-msgs"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "no_std wire protocol and embedded messages for Cybflight"
repository = "https://github.com/cybird-robotics/cybflight-msgs"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[features]
default = []
embedded = ["dep:defmt", "dep:embassy-time", "dep:nalgebra"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
embassy-time = { version = "0.5.0", optional = true, features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
nalgebra = { version = "0.34.1", optional = true, default-features = false, features = ["libm", "defmt"] }
